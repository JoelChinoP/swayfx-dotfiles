# Verified against: https://aur.archlinux.org/packages/brave-origin-bin wrapper behavior
# Reviewed: 2026-07-09

# Keep Brave Origin from prompting for a GNOME/KWallet keyring password on
# this TTY/Sway session. Password storage stays in the browser profile.
--password-store=basic

# Sway/Wayland uses ANGLE over OpenGL here; Vulkan logs compatibility errors.
--disable-vulkan
--use-angle=gl
